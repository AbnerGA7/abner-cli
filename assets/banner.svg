<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a1e"/>
      <stop offset="1" stop-color="#140c2b"/>
    </linearGradient>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" rx="20" fill="url(#fondo)"/>
  <ellipse cx="450" cy="135" rx="380" ry="140" fill="url(#brillo)"/>

  <circle cx="34" cy="30" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="30" r="6" fill="#febc2e"/>
  <circle cx="74" cy="30" r="6" fill="#28c840"/>
  <text x="450" y="35" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#6b5b95">~/mi-proyecto — abner</text>

  <text x="450" y="160" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="118" font-weight="900" letter-spacing="14" fill="url(#marca)" filter="url(#glow)">ABNER</text>

  <text x="450" y="212" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="22" fill="#e9e3ff"><tspan fill="#a855f7">◆</tspan> tu asistente de Git y GitHub en la terminal</text>

  <text x="450" y="258" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#8b7fb8"><tspan fill="#38bdf8">$</tspan> npm install -g @abnerg7/abner</text>
</svg>
